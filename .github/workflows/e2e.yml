name: E2E

# Generating a real Rails app takes minutes, so this runs nightly rather than
# on every pull request. Trigger it by hand before a release.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_E2E: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Matches Generator::TARGET_RUBY_VERSION, which generated apps pin.
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Rails
        run: gem install rails --no-document

      - name: Generate and verify a Rails app
        run: bundle exec rspec spec/e2e
